# Render Blueprint: one web service built from the Dockerfile, with a persistent disk for the database.
# Persistent disks need a paid instance type (starter or above) — on the free plan data is lost on every restart.
services:
  - type: web
    name: realestate-crm
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /data
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      # Render puts one proxy in front of the app; this makes rate limits use the visitor's address, not the proxy's.
      - key: TRUST_PROXY
        value: "1"
      # The first organization can always be created; after that new sign-ups are closed. Leave this false.
      - key: ALLOW_SIGNUP
        value: "false"
      # Optional AI assistant — add ANTHROPIC_API_KEY in the Render dashboard (never in this file).
    disk:
      name: crm-data
      mountPath: /data
      sizeGB: 1
